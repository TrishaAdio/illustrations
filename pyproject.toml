[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalam"
version = "0.1.0"
description = "Satyajit Ray-style pen-and-ink illustration plates from photographs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pillow>=10.0",
    "scipy>=1.10",
    "opencv-python-headless>=4.8",
]

[project.scripts]
kalam = "kalam.cli:main"

[tool.setuptools.packages.find]
include = ["kalam*"]

[tool.ruff]
line-length = 96
target-version = "py310"
